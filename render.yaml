services:
  - type: web
    name: event-waitlist
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # ONE worker on purpose: the waitlist queues live in memory (see README)
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PRODUCTION
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
