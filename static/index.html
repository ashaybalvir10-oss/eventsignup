<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Waitlist</title>
<style>
:root{--bg:#fafaf8;--fg:#1a1a1a;--muted:#6b6b66;--card:#fff;--line:#e2e2dc;--accent:#3b5bdb;--ok:#1d8a4e;--warn:#c4570c}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--muted:#9a9a94;--card:#1d1d1d;--line:#333;--accent:#7b97f5;--ok:#4cc27f;--warn:#f08a4b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:1.1rem}header nav{display:flex;gap:.8rem;align-items:center;font-size:.9rem}
a{color:var(--accent)}
main{max-width:820px;margin:1.2rem auto;padding:0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;margin:0 0 1rem}
h2,h3{margin:.1rem 0 .5rem}h3{font-size:1.05rem}
input,button,textarea{font:inherit;padding:.5rem .7rem;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input,textarea{width:100%;margin:.25rem 0}
button{cursor:pointer}button.p{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button{border:0;background:none;padding:.3rem .6rem;color:var(--muted)}.tabs button.on{color:var(--fg);border-bottom:2px solid var(--accent);border-radius:0}
.muted{color:var(--muted);font-size:.88rem}
.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:.6rem 0 .3rem}.bar i{display:block;height:100%;background:var(--ok)}
.badge{font-size:.78rem;font-weight:700;padding:.2rem .6rem;border-radius:99px;color:#fff}.b-ok{background:var(--ok)}.b-wait{background:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}@media(max-width:560px){.two{grid-template-columns:1fr}}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
</style></head><body>
<header><b>Event Waitlist</b><nav id="nav"></nav></header>
<main>
  <div id="auth" class="card" hidden>
    <div class="tabs"><button id="tl" class="on" onclick="tab('login')">Sign in</button><button id="tr" onclick="tab('register')">Create account</button></div>
    <div id="nameRow" hidden><input id="name" placeholder="Full name" autocomplete="name"></div>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Password (min 8 characters)" autocomplete="current-password" onkeydown="if(event.key==='Enter')authGo()">
    <button class="p" id="go" onclick="authGo()" style="margin-top:.4rem">Sign in</button>
  </div>
  <div id="admin" class="card" hidden>
    <h3>Create an event <span class="muted">(admin)</span></h3>
    <input id="en" placeholder="Event name">
    <input id="ed" placeholder="Description (optional)">
    <div class="two"><input id="el" placeholder="Location"><input id="es" type="datetime-local"></div>
    <div class="two"><input id="ec" type="number" min="1" placeholder="Capacity"><button class="p" onclick="createEvent()">Create event</button></div>
  </div>
  <div id="events"></div>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=(u,m="GET",b)=>fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b&&JSON.stringify(b)}).then(r=>r.json());
let me=null,mode="login",timer;
function toast(t){const e=$("toast");e.textContent=t;e.className="show";clearTimeout(timer);timer=setTimeout(()=>e.className="",3500)}

function tab(m){mode=m;$("tl").className=m==="login"?"on":"";$("tr").className=m==="register"?"on":"";
  $("nameRow").hidden=m!=="register";$("go").textContent=m==="login"?"Sign in":"Create account";
  $("pw").autocomplete=m==="login"?"current-password":"new-password"}
async function authGo(){
  const b={email:$("email").value,password:$("pw").value};if(mode==="register")b.name=$("name").value;
  const r=await api(mode==="login"?"/api/login":"/api/register","POST",b);
  if(r.error)return toast(r.error);
  me=r.user;$("pw").value="";toast(mode==="login"?"Welcome back!":"Account created - check your email.");render();load()}
async function logout(){await api("/api/logout","POST",{});me=null;render();load()}

function render(){
  $("auth").hidden=!!me;$("admin").hidden=!(me&&me.is_admin);
  $("nav").innerHTML=me?`<span>${esc(me.name)}${me.is_admin?" (admin)":""}</span>${me.is_admin?'<a href="/visualizer">Queue visualizer</a>':""}<button onclick="logout()">Sign out</button>`:"";
}
async function createEvent(){
  const r=await api("/api/events","POST",{name:$("en").value,description:$("ed").value,location:$("el").value,starts_at:$("es").value.replace("T"," "),capacity:$("ec").value});
  if(r.error)return toast(r.error);
  ["en","ed","el","es","ec"].forEach(i=>$(i).value="");toast("Event created");load()}
async function join(id){
  const r=await api(`/api/events/${id}/signup`,"POST",{});
  toast(r.error||(r.status==="confirmed"?"You're confirmed! Check your email.":`Event is full - you're #${r.position} on the waitlist. We'll email you if a spot opens.`));load()}
async function leave(id){
  if(!confirm("Leave this event?"))return;
  const r=await api(`/api/events/${id}/cancel`,"POST",{});toast(r.error||"You've left the event.");load()}

async function load(){
  const evs=await api("/api/events");
  $("events").innerHTML=evs.length?evs.map(e=>{
    const pct=100*e.confirmed/e.capacity;
    const badge=e.my_status==="confirmed"?'<span class="badge b-ok">You\'re in</span>':e.my_status==="waitlisted"?`<span class="badge b-wait">Waitlist #${e.my_position}</span>`:"";
    const btn=!me?'<span class="muted">Sign in to join</span>':e.my_status?`<button onclick="leave(${e.id})">${e.my_status==="waitlisted"?"Leave waitlist":"Cancel my spot"}</button>`
      :`<button class="p" onclick="join(${e.id})">${e.spots_left>0?"Join event":"Join waitlist"}</button>`;
    return `<div class="card"><div class="top"><div><h3>${esc(e.name)}</h3>
      <div class="muted">${[e.starts_at,e.location].filter(Boolean).map(esc).join(" · ")}</div>${e.description?`<p style="margin:.4rem 0">${esc(e.description)}</p>`:""}</div>${badge}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="top"><span class="muted">${e.confirmed}/${e.capacity} spots filled · ${e.waitlist_length} on waitlist</span>${btn}</div></div>`}).join("")
    :'<div class="card muted">No events yet.</div>';
}
(async()=>{const r=await api("/api/me");me=r.user;render();load();setInterval(load,8000)})();
</script></body></html>
